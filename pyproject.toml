[project]
name = "cupid"
version = "0.1.0"
description = "NYC marriage license/ceremony appointment watcher and auto-booker"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "twilio>=9.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.1",
    "click>=8.1",
    "pytz>=2024.1",
]

[project.scripts]
cupid = "cupid.__main__:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cupid*"]
